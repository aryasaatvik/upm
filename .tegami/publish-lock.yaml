core:changelogs:
  - content: "---\npackages:\n  npm:@aryasaatvik/upm:\n    type: minor\n---\n\n### Start the upm fork for Cloudflare Workers\n\nPublish the scoped fork with Cloudflare Workers runtime fixes for gzip decompression and missing install state files.\n"
